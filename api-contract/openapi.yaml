openapi: 3.0.3
info:
  title: TRACKSY API
  description: |
    Smart Student Transport Tracking System API Contract
    
    This API provides endpoints for:
    - Student mobile application
    - Driver mobile application
    - Admin dashboard
    
    All endpoints require authentication except login and registration.
  version: 1.0.0
  contact:
    name: TRACKSY Team
    email: support@tracksy.com
  license:
    name: Proprietary

servers:
  - url: http://localhost:8000/api
    description: Development server
  - url: http://127.0.0.1:4010
    description: Prism mock server
  - url: https://api.tracksy.com/api
    description: Production server

tags:
  - name: Authentication
    description: Authentication and authorization endpoints
  - name: Students
    description: Student-related endpoints
  - name: Drivers
    description: Driver-related endpoints
  - name: Admins
    description: Admin-related endpoints
  - name: Buses
    description: Bus management endpoints
  - name: Routes
    description: Route management endpoints
  - name: Stops
    description: Stop management endpoints
  - name: Bookings
    description: Seat booking endpoints
  - name: Trips
    description: Trip management endpoints
  - name: Analytics
    description: Analytics and reporting endpoints
  - name: Notifications
    description: Notification management endpoints
  - name: System
    description: System settings and assets

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    
    Success:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
    
    # Authentication Schemas
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User email or student/driver ID
        password:
          type: string
          minLength: 6
    
    RegisterRequest:
      type: object
      required:
        - studentId
        - name
        - email
        - password
        - institution
      properties:
        studentId:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        institution:
          type: string
        confirmPassword:
          type: string
    
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/User'
    
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        studentId:
          type: string
        institution:
          type: string
        role:
          type: string
          enum: [student, driver, admin]

    SystemSettings:
      type: object
      properties:
        app_name:
          type: string
          example: Tracksy
        app_logo:
          type: string
          example: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%235b21b6'/><stop offset='1' stop-color='%23c026d3'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='url(%23g)'/><text x='50%25' y='50%25' font-size='28' font-family='Arial' fill='white' dominant-baseline='middle' text-anchor='middle'>T</text></svg>"
        timezone:
          type: string
          example: Asia/Karachi
        date_format:
          type: string
          example: YYYY-MM-DD
        time_format:
          type: string
          example: HH:mm
        language:
          type: string
          example: en
        require_fee_clearance:
          type: boolean
          example: true
    
    # Bus Schemas
    Bus:
      type: object
      properties:
        id:
          type: integer
        busNumber:
          type: string
        licensePlate:
          type: string
        busType:
          type: string
          enum: [standard, premium]
        capacity:
          type: integer
        currentRouteId:
          type: integer
        currentDriverId:
          type: integer
        status:
          type: string
          enum: [active, inactive, maintenance, emergency]
        location:
          $ref: '#/components/schemas/Location'
        lastUpdated:
          type: string
          format: date-time
    
    Location:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        accuracy:
          type: number
        speed:
          type: number
        heading:
          type: number
        timestamp:
          type: string
          format: date-time
    
    BusCreate:
      type: object
      required:
        - busNumber
        - licensePlate
        - capacity
      properties:
        busNumber:
          type: string
        licensePlate:
          type: string
        busType:
          type: string
          enum: [standard, premium]
        capacity:
          type: integer
        routeId:
          type: integer
        driverId:
          type: integer
        status:
          type: string
          enum: [active, inactive, maintenance]
    
    # Route Schemas
    Route:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        startPoint:
          type: string
        endPoint:
          type: string
        distance:
          type: number
        estimatedDuration:
          type: integer
        stops:
          type: array
          items:
            $ref: '#/components/schemas/Stop'
        activeBuses:
          type: array
          items:
            $ref: '#/components/schemas/Bus'
        studentCount:
          type: integer
    
    RouteCreate:
      type: object
      required:
        - name
        - startPoint
        - endPoint
        - stops
      properties:
        name:
          type: string
        startPoint:
          type: string
        endPoint:
          type: string
        stops:
          type: array
          items:
            type: integer
          description: Array of stop IDs in order
        estimatedDuration:
          type: integer
    
    # Stop Schemas
    Stop:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        estimatedTime:
          type: integer
        routes:
          type: array
          items:
            type: integer
    
    StopCreate:
      type: object
      required:
        - name
        - address
        - latitude
        - longitude
      properties:
        name:
          type: string
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
    
    # Booking Schemas
    Booking:
      type: object
      properties:
        id:
          type: integer
        studentId:
          type: integer
        busId:
          type: integer
        seatNumber:
          type: string
        tripDate:
          type: string
          format: date
        status:
          type: string
          enum: [pending, confirmed, cancelled, completed]
        createdAt:
          type: string
          format: date-time
    
    BookingCreate:
      type: object
      required:
        - busId
        - seatNumber
        - tripDate
      properties:
        busId:
          type: integer
        seatNumber:
          type: string
        tripDate:
          type: string
          format: date
    
    SeatAvailability:
      type: object
      properties:
        busId:
          type: integer
        totalSeats:
          type: integer
        availableSeats:
          type: integer
        occupiedSeats:
          type: integer
        reservedSeats:
          type: integer
        seatMap:
          type: object
          additionalProperties:
            type: string
            enum: [available, occupied, reserved]
    
    # Trip Schemas
    Trip:
      type: object
      properties:
        id:
          type: integer
        driverId:
          type: integer
        busId:
          type: integer
        routeId:
          type: integer
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          type: string
          enum: [not_started, in_progress, completed, cancelled]
        distance:
          type: number
        duration:
          type: integer
        passengerCount:
          type: integer
    
    TripStart:
      type: object
      required:
        - routeId
        - busId
      properties:
        routeId:
          type: integer
        busId:
          type: integer
        startLocation:
          $ref: '#/components/schemas/Location'
    
    # Driver Schemas
    Driver:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        driverId:
          type: string
        licenseNumber:
          type: string
        assignedBusId:
          type: integer
        assignedRouteId:
          type: integer
        status:
          type: string
          enum: [active, on_leave, inactive]
        currentLocation:
          $ref: '#/components/schemas/Location'
    
    LocationUpdate:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        accuracy:
          type: number
        speed:
          type: number
        heading:
          type: number
        timestamp:
          type: string
          format: date-time
    
    LocationBatch:
      type: object
      properties:
        locations:
          type: array
          items:
            $ref: '#/components/schemas/LocationUpdate'
    
    # Passenger Schemas
    Passenger:
      type: object
      properties:
        id:
          type: integer
        studentId:
          type: integer
        name:
          type: string
        boardingStop:
          type: integer
        alightingStop:
          type: integer
        seatNumber:
          type: string
        checkedIn:
          type: boolean
        checkedInAt:
          type: string
          format: date-time
    
    CheckInRequest:
      type: object
      required:
        - studentId
        - tripId
      properties:
        studentId:
          type: integer
        tripId:
          type: integer
        seatNumber:
          type: string
    
    # Emergency Schemas
    EmergencyAlert:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [accident, breakdown, medical, other]
        description:
          type: string
        location:
          $ref: '#/components/schemas/Location'
    
    IncidentReport:
      type: object
      required:
        - type
        - description
      properties:
        type:
          type: string
        description:
          type: string
        location:
          $ref: '#/components/schemas/Location'
        photoUrl:
          type: string
    
    # Notification Schemas
    Notification:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        type:
          type: string
          enum: [route_deviation, delay, seat_available, stop_arrival, safety, general]
        title:
          type: string
        message:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
    
    # Alert Schemas
    Alert:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [route_deviation, delay, emergency, maintenance, system]
        title:
          type: string
        message:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        status:
          type: string
          enum: [new, acknowledged, resolved]
        bus_id:
          type: integer
        route_id:
          type: integer
        created_by:
          type: integer
        acknowledged_by:
          type: integer
        resolved_by:
          type: integer
        acknowledged_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    
    # Analytics Schemas
    AnalyticsOverview:
      type: object
      properties:
        totalBuses:
          type: integer
        activeBuses:
          type: integer
        totalStudents:
          type: integer
        totalRoutes:
          type: integer
        onTimePercentage:
          type: number
        currentAlerts:
          type: integer
    
    UsageStatistics:
      type: object
      properties:
        dateRange:
          type: object
          properties:
            start:
              type: string
              format: date
            end:
              type: string
              format: date
        dailyTrips:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              count:
                type: integer
        peakHours:
          type: array
          items:
            type: object
            properties:
              hour:
                type: integer
              count:
                type: integer

paths:
  /favicon.ico:
    get:
      tags:
        - System
      summary: Favicon placeholder for mock server
      responses:
        '204':
          description: No content
  # ============================================
  # ROOT ENDPOINT (API Information)
  # ============================================
  
  /:
    get:
      tags:
        - API Info
      summary: API Information
      description: Get API information and version
      responses:
        '200':
          description: API information
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: TRACKSY API
                  version:
                    type: string
                    example: 1.0.0
                  description:
                    type: string
                    example: Smart Student Transport Tracking System API
                  endpoints:
                    type: object
                    properties:
                      authentication:
                        type: string
                        example: /auth/login, /auth/register
                      student:
                        type: string
                        example: /buses, /routes, /bookings
                      driver:
                        type: string
                        example: /driver/trips, /driver/location
                      admin:
                        type: string
                        example: /admin/buses, /admin/routes
                  documentation:
                    type: string
                    example: See OpenAPI specification for full details
  
  # ============================================
  # AUTHENTICATION ENDPOINTS
  # ============================================
  
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Login endpoint for students, drivers, and admins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /auth/register:
    post:
      tags:
        - Authentication
        - Students
      summary: Student registration
      description: Register a new student account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  
  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Password reset email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
  
  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  /settings/system:
    get:
      tags:
        - System
      summary: Get system settings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: System settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
              example:
                app_name: Tracksy
                app_logo: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%235b21b6'/><stop offset='1' stop-color='%23c026d3'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='url(%23g)'/><text x='50%25' y='50%25' font-size='28' font-family='Arial' fill='white' dominant-baseline='middle' text-anchor='middle'>T</text></svg>"
                timezone: Asia/Karachi
                date_format: YYYY-MM-DD
                time_format: HH:mm
                language: en
                require_fee_clearance: true
    put:
      tags:
        - System
      summary: Update system settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemSettings'
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'

  /settings/upload-logo:
    post:
      tags:
        - System
      summary: Upload system logo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                logo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Logo uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
              example:
                url: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%235b21b6'/><stop offset='1' stop-color='%23c026d3'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='url(%23g)'/><text x='50%25' y='50%25' font-size='28' font-family='Arial' fill='white' dominant-baseline='middle' text-anchor='middle'>T</text></svg>"
  
  # ============================================
  # DRIVER ENDPOINTS
  # ============================================
  
  /driver/login:
    post:
      tags:
        - Drivers
        - Authentication
      summary: Driver login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  
  /driver/me:
    get:
      tags:
        - Drivers
      summary: Get driver profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Driver information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
  
  /driver/refresh-token:
    post:
      tags:
        - Drivers
        - Authentication
      summary: Refresh driver token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
  
  /driver/trips/start:
    post:
      tags:
        - Drivers
        - Trips
      summary: Start a trip
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripStart'
      responses:
        '201':
          description: Trip started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
  
  /driver/trips/{id}/end:
    post:
      tags:
        - Drivers
        - Trips
      summary: End a trip
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                endLocation:
                  $ref: '#/components/schemas/Location'
      responses:
        '200':
          description: Trip ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
  
  /driver/trips/current:
    get:
      tags:
        - Drivers
        - Trips
      summary: Get current trip
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current trip information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
              example:
                id: 101
                driver_id: 12
                bus_id: 4
                route_id: 2
                start_time: "2025-12-28T08:10:00Z"
                status: in_progress
                distance: 18.7
                duration: null
                passenger_count: 22
                bus:
                  id: 4
                  bus_number: BUS-407
                  license_plate: ISB-4407
                route:
                  id: 2
                  name: Islamabad Tech Corridor
                  start_point: G-9 Markaz, Islamabad
                  end_point: NUST H-12, Islamabad
        '404':
          description: No active trip
  
  /driver/trips:
    get:
      tags:
        - Drivers
        - Trips
      summary: Get trip history
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Trip history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trip'
                  pagination:
                    type: object
              example:
                data:
                  - id: 90
                    driver_id: 12
                    bus_id: 4
                    route_id: 2
                    start_time: "2025-12-27T07:30:00Z"
                    end_time: "2025-12-27T08:15:00Z"
                    status: completed
                    distance: 18.7
                    duration: 45
                    passenger_count: 26
                    bus:
                      id: 4
                      bus_number: BUS-407
                      license_plate: ISB-4407
                    route:
                      id: 2
                      name: Islamabad Tech Corridor
                      start_point: G-9 Markaz, Islamabad
                      end_point: NUST H-12, Islamabad
                  - id: 91
                    driver_id: 12
                    bus_id: 4
                    route_id: 2
                    start_time: "2025-12-26T07:30:00Z"
                    end_time: "2025-12-26T08:20:00Z"
                    status: completed
                    distance: 18.7
                    duration: 50
                    passenger_count: 24
                    bus:
                      id: 4
                      bus_number: BUS-407
                      license_plate: ISB-4407
                    route:
                      id: 2
                      name: Islamabad Tech Corridor
                      start_point: G-9 Markaz, Islamabad
                      end_point: NUST H-12, Islamabad
                pagination:
